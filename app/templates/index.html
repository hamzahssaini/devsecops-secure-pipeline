<!DOCTYPE html>
<html>
<head>
    <title>DevSecOps Pipeline Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; color: #333; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; margin: 5px 0; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .danger { background: #f8d7da; color: #721c24; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #5568d3; }
        .note { background: #f8f9fa; padding: 12px; margin: 10px 0; border-left: 3px solid #667eea; }
        .error { color: #721c24; background: #f8d7da; padding: 10px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">

        <div class="card">
            <h2>Create Note</h2>
            <div id="create-msg"></div>
            <form id="note-form">
                <input type="text" id="title" placeholder="Title" required>
                <textarea id="content" placeholder="Content" required></textarea>
                <button type="submit">Add Note</button>
            </form>
        </div>

        <div class="card">
            <h2>Notes</h2>
            <div id="notes-list">Loading...</div>
        </div>
    </div>

    <script>
        async function fetchNotes() {
            try {
                const response = await fetch('/notes');
                const data = await response.json();
                if (!data.notes || data.notes.length === 0) {
                    document.getElementById('notes-list').innerHTML = '<p>No notes yet</p>';
                    return;
                }
                const html = data.notes.map(note => `
                    <div class="note">
                        <b>${note.title}</b>
                        <p>${note.content}</p>
                    </div>
                `).join('');
                document.getElementById('notes-list').innerHTML = html;
            } catch (error) {
                document.getElementById('notes-list').innerHTML = `<div class="error">Failed to fetch</div>`;
            }
        }

        document.getElementById('note-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            try {
                const response = await fetch('/notes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title, content})
                });
                if (response.ok) {
                    document.getElementById('create-msg').innerHTML = '<div class="badge success">Note created!</div>';
                    document.getElementById('note-form').reset();
                    setTimeout(() => { document.getElementById('create-msg').innerHTML = ''; fetchNotes(); }, 1500);
                }
            } catch (error) {
                document.getElementById('create-msg').innerHTML = '<div class="error">Error creating note</div>';
            }
        });

        fetchNotes();
    </script>
</body>
</html>
